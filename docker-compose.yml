# Local development stack for 001-court-register-port and 002-consolidate-progression-leg.
#
# Everything here is LOCAL ONLY. The credentials below are development defaults, deliberately
# committed so the stack starts with no .env file; they are never used in any deployed environment,
# where Postgres credentials and the Service Bus identity come from Key Vault via the Secrets Store
# CSI driver.
#
#   docker compose up -d postgres servicebus-emulator   # the 001 intake half, for ./gradlew bootRun
#   docker compose up -d artemis fileservice-postgres wiremock sdg-echo
#                                                       # + the 002 generation half
#   docker compose up app                               # the service in its container
#
# The generation half is four services and one helper (see quickstart.md for the full local loop):
# `artemis` carries the shared `public.event` topic, `fileservice-postgres` is the framework file
# service's database, `wiremock` stands in for systemdocgenerator, notificationnotify and Azure App
# Configuration, and `sdg-echo` turns each stubbed `generate-document` into the
# `document-available` event the real renderer would publish - as a framework JsonEnvelope, i.e. a
# top-level `_metadata` (whose `name` is the field the listener reads) alongside the payload fields
# - so the loop closes with no real SDG.
#
# `app` runs the generation half against those stubs - `YOTRESULTSDISTRIBUTION_GENERATION_ENABLED=true`, the
# file-service datasource on `fileservice-postgres`, systemdocgenerator, notificationnotify and App
# Configuration on `wiremock`, the broker on `artemis` - so `docker compose exec app ./startup.sh
# generate-register|list-batches|check-flag` works as quickstart.md writes it.
#
# `app` still deliberately declares no depends_on, so it can be started on its own. Nothing it now
# points at gates readiness: the readiness group is `db,intakeStartup,fileServiceRun`, the broker is
# never in it (spec FR-011) and the file-service component answers UP between runs without asking,
# which is what `e2e/ReadinessPolicyIT` pins. Only `postgres` has to be there for the pod to report
# ready; `wiremock` has to be there for a command that reads the flag to get an answer.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      # Maps to yotresultsdistribution.servicebus.* @ConfigurationProperties.
      YOTRESULTSDISTRIBUTION_SERVICEBUS_CONNECTIONSTRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      YOTRESULTSDISTRIBUTION_SERVICEBUS_QUEUENAME: yotresultsdistribution.requests
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yotresultsdistribution
      SPRING_DATASOURCE_USERNAME: yotresultsdistribution
      SPRING_DATASOURCE_PASSWORD: yotresultsdistribution
      # A local run is the walking-skeleton shape: the stub adapters, which is what STUB mode
      # exists for. LIVE — the default an environment that says nothing gets — refuses to start
      # without upstream endpoints and a CJSCPPUID identity, deliberately, so a deployed pod
      # cannot boot half-configured. Local compose has neither results nor reference data to call.
      YOTRESULTSDISTRIBUTION_PAYLOAD_MODE: STUB
      YOTRESULTSDISTRIBUTION_REFERENCEDATA_MODE: STUB
      # The two estate filters, off for the local loop. `application.yaml` defaults BOTH ON
      # (constitution 5.0.0), and this is one of the two places that deliberately turns them off:
      # a laptop has no usersgroups for `cp-auth-rules-filter` to resolve a caller's groups
      # through and no Artemis audit broker for `cp-audit-filter-springboot` to publish to, so
      # `curl localhost:8082/operations/flag` needs no identity header here and nothing is audited.
      # Nothing refuses a pod for this - the switches are configuration, not a start-up condition -
      # so what it changes is only what this stack builds and requires.
      AUTHZ_HTTP_ENABLED: "false"
      HTTP_AUDIT_ENABLED: "false"
      # Local-only dummy: the submission gateway refuses to construct without an identity, and a
      # local run POSTs nothing. Never a real user id.
      YOT_RESULTS_DISTRIBUTION_SYSTEM_USER_ID: 00000000-0000-0000-0000-000000000000
      # The generation half, on, against the stubs below. Enabling it makes every setting under it
      # required at startup - the file-service datasource, the flag endpoint and label, the two
      # downstream endpoints, the e-mail template id and the broker - which is the whole reason
      # they are all named here rather than left to be discovered at 18:00.
      YOTRESULTSDISTRIBUTION_GENERATION_ENABLED: "true"
      # The REAL App Configuration reader, pointed at the WireMock `kv` stub, with the published
      # local pair and not STUB: what runs here is the deployed reader, the deployed SDK client and
      # the deployed fail-closed parsing, signed with a pair no store authorises and the stub does
      # not check. NOT A SECRET: Secret= is Base64 of "not-a-secret". Startup refuses this pair
      # against a real .azconfig.io store or on a pod with a Service Bus namespace.
      YOTRESULTSDISTRIBUTION_FEATURE_CONNECTION_STRING: "Endpoint=http://wiremock:8080;Id=0-l0-s0:yotresultsdistributionlocal;Secret=bm90LWEtc2VjcmV0" # gitleaks:allow
      # The label the committed mappings answer under (docker/wiremock/README.md).
      STACK_LABEL: LOCAL
      # The framework file service's own database, which the PDF payload is written straight into
      # because systemdocgenerator renders only a payload that is already there. 5432 inside the
      # network; 5433 is the host mapping.
      FILESERVICE_DATASOURCE_URL: jdbc:postgresql://fileservice-postgres:5432/fileservice
      FILESERVICE_DATASOURCE_USERNAME: fileservice
      FILESERVICE_DATASOURCE_PASSWORD: fileservice
      # Hosts only: each client appends its own contract path, so a path written here would be
      # appended to. Both are the one WireMock, whose stubbed paths are disjoint.
      SYSTEMDOCGENERATOR_BASE_URL: http://wiremock:8080
      NOTIFICATIONNOTIFY_BASE_URL: http://wiremock:8080
      # Local-only dummy, and a UUID because startup checks the shape rather than waiting for
      # notificationnotify to refuse every recipient of every batch (fix P9). Never a real
      # template id.
      CR_EMAIL_TEMPLATE_ID: 11111111-1111-1111-1111-111111111111
      # The broker the document-available events arrive on. Required whenever completion is
      # event-driven, and it is; the broker never gates readiness, so the pod is ready before this
      # is reachable and stays ready if it goes away.
      ARTEMIS_BROKER_URL: tcp://artemis:61616
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      # The 07:00 Europe/London weekday report. Independent of YOTRESULTSDISTRIBUTION_GENERATION_ENABLED:
      # the report is a read of this service's own store and must keep running on a pod that
      # generates nothing, which is what makes an intake-only deployment alertable. Its window
      # needs no setting: a run reports from the previous scheduled run to now, so Monday reads
      # back to Friday and nothing falls between two windows.
      YOTRESULTSDISTRIBUTION_REPORT_ENABLED: "true"
      # The intake gauges refresh on this interval in every service JVM that is not a command,
      # whether or not the report or the generation half is enabled, and under no lock: a gauge
      # describes the JVM that publishes it, so alerts aggregate across pods with max(). Ten
      # minutes by default.
      YOTRESULTSDISTRIBUTION_INTAKE_GAUGE_REFRESH: 10m
      # The e-mail output, switched separately from the Log Analytics output. On locally so the
      # WireMock notificationnotify stub is exercised; off in every environment until the
      # notificationnotify team provides the template.
      YOTRESULTSDISTRIBUTION_REPORT_EMAIL_ENABLED: "true"
      # Local-only dummies. Never a real template id and never a real address: in a deployed
      # environment both arrive from Key Vault through the CSI driver.
      CR_REPORT_TEMPLATE_ID: 22222222-2222-2222-2222-222222222222
      YOTRESULTSDISTRIBUTION_REPORT_RECIPIENTS: support@example.invalid

  # The service's own store. Flyway runs at the application's start-up, not here.
  #
  # START FROM A CLEAN VOLUME ACROSS V7. V7__retire_reconciler_vocabulary.sql narrows three CHECK
  # constraints, and Postgres refuses to add a constraint to a table that already holds a violating
  # row - so a postgres-data volume carrying a batch failed GENERATION_TIMED_OUT or completed by
  # RECONCILER (anything a pre-004 local run produced) stops the migration and the application will
  # not start. `docker compose down -v` before the first run on 004, or delete those rows. Confirmed
  # on this file's own volume; the refusal names register_batch_failure_reason_chk and leaves the
  # row where it was. V6 and everything before it only ever widened and refuse on nothing.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: yotresultsdistribution
      POSTGRES_USER: yotresultsdistribution
      POSTGRES_PASSWORD: yotresultsdistribution
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yotresultsdistribution -d yotresultsdistribution"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Azure Service Bus emulator, per Microsoft's reference compose file. It needs a SQL Server
  # container beside it for its own state; from the host the broker is on localhost:5672, and the
  # connection string is
  #   Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
  #
  # The tag is PINNED deliberately, not tracked with `latest`: a moved tag on a broker emulator can
  # change settlement or delivery-count behaviour under a green build. Bump it as its own reviewed
  # change, re-running the *IT suites. The same config.json is mounted by the Testcontainers
  # harness, so the queue definition cannot drift between this stack and CI.
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:1.1.2
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-emulator-mssql
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"
    volumes:
      - ./docker/servicebus-emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      - servicebus-emulator-mssql

  # State store for the emulator. `mcr.microsoft.com/azure-sql-edge` is retired and must not be
  # reintroduced; Microsoft's current emulator topology uses SQL Server. MSSQL_SA_PASSWORD matches
  # the value the emulator is configured with above.
  servicebus-emulator-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalOnly_Passw0rd!"

  # ---------------------------------------------------------------------------------------------
  # 002: the generation half's dependencies.
  # ---------------------------------------------------------------------------------------------

  # The estate's shared `public.event` topic, which is where systemdocgenerator publishes each
  # document's outcome and where this service's durable subscription listens. The address is created
  # with the broker instance rather than left to auto-creation: `--addresses public.event` defaults
  # to the MULTICAST routing type, and an address that auto-created as anycast would deliver each
  # event to one subscriber instead of all of them - the local stack would then disagree with the
  # deployed broker about the one thing the topic exists for.
  #
  # `apache/activemq-artemis`, PINNED, rather than the estate's `hmcts/artemis_ubuntu`: the estate
  # image lives in a private ACR that a fresh clone cannot pull. The wire protocol is the same one
  # (Artemis CORE on 61616), which is what the service talks; the version is bumped as its own
  # reviewed change, re-running *IT.
  artemis:
    image: apache/activemq-artemis:2.42.0-alpine
    ports:
      # The broker's multiplexed acceptor: CORE for the service, STOMP for the sdg-echo helper.
      - "61616:61616"
      # The management console, for looking at the subscription and its backlog by hand.
      - "8161:8161"
    environment:
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      ANONYMOUS_LOGIN: "false"
      # --http-host / --relax-jolokia are the image's own defaults, repeated because naming
      # EXTRA_ARGS replaces them; the console is unreachable without them.
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia --addresses public.event"
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --user admin --password admin || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # The framework file service's Postgres - ONE shared database per stack in a deployed environment,
  # and the reason this service writes the PDF payload straight into it: systemdocgenerator renders
  # only a payload that is already in the file service. Seeded from docker/fileservice/init.sql,
  # which is the vendored liquibase changesets 001–006 written as plain DDL (see the header there).
  # 5433 on the host: 5432 is this service's own store above.
  fileservice-postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fileservice
      POSTGRES_USER: fileservice
      POSTGRES_PASSWORD: fileservice
    volumes:
      # Run once, on an empty data directory. `docker compose down --volumes` is what re-seeds it
      # after the DDL changes.
      - ./docker/fileservice/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - fileservice-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileservice -d fileservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  # systemdocgenerator (the one command), notificationnotify and the Azure App Configuration
  # data-plane read, all on one port. The mappings and the flag switch are documented in
  # docker/wiremock/README.md. PINNED for the same reason the emulator is: a moved tag on a stub
  # server can change matching behaviour under a green build.
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      # The whole directory, so WireMock finds `mappings/` where it expects it.
      - ./docker/wiremock:/home/wiremock:ro
    # Verbose deliberately: a mapping that does not match prints the near-miss diff, which is the
    # difference between "the local loop is broken" and "the Content-Type is wrong".
    command: ["--verbose", "--local-response-templating"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The renderer's echo: WireMock can answer 202 but cannot publish, so this turns each
  # `generate-document` it accepted into the `document-available` JsonEnvelope (`_metadata.name`
  # plus the payload fields) the real systemdocgenerator
  # would put on `public.event`. Without it a local batch would sit in GENERATING until the next
  # run gave it back, and the event-driven completion path would never run locally.
  # A stock python image with the script mounted: no image to build, and nothing to keep in step
  # with a Dockerfile.
  sdg-echo:
    image: python:3.13-alpine
    command: ["python", "-u", "/opt/sdg-echo/sdg-echo.py"]
    volumes:
      - ./docker/sdg-echo/sdg-echo.py:/opt/sdg-echo/sdg-echo.py:ro
    environment:
      WIREMOCK_URL: http://wiremock:8080
      ARTEMIS_HOST: artemis
      ARTEMIS_PORT: "61616"
      ARTEMIS_USER: admin
      ARTEMIS_PASSWORD: admin
      PUBLIC_EVENT_TOPIC: public.event
    depends_on:
      wiremock:
        condition: service_healthy
      artemis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  fileservice-data:
