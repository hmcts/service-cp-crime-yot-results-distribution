buildscript {
  dependencies {
    // The Gatling plugin brings plexus-utils 4.x onto the shared plugin classpath, which wins
    // conflict resolution over CycloneDX's 3.x. 4.x moved org.codehaus.plexus.util.xml into
    // the separate plexus-xml artifact, so without it cyclonedxBom fails with
    // NoClassDefFoundError: XmlPullParserException. plexus-xml 3.x is the plexus-utils 4 /
    // Maven 3 line (4.x targets Maven 4).
    classpath 'org.codehaus.plexus:plexus-xml:3.0.1'
  }
}

plugins {
  id 'application'
  id 'java'
  id 'org.springframework.boot' version '4.1.1'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'jacoco'
  id 'maven-publish'
  id 'com.github.ben-manes.versions' version '0.65.0'
  id 'org.cyclonedx.bom' version '3.5.0'
  id 'com.gorylenko.gradle-git-properties' version '4.0.1'
  id 'io.gatling.gradle' version '3.15.1.3'
}

group = 'uk.gov.hmcts.cp'
version = System.getProperty('ARTEFACT_VERSION') ?: '0.0.999'

apply {
  from("$rootDir/gradle/repositories.gradle")
  from("$rootDir/gradle/java.gradle")
  from("$rootDir/gradle/dependency.gradle")
  from("$rootDir/gradle/pmd.gradle")
  from("$rootDir/gradle/checkstyle.gradle")
  from("$rootDir/gradle/test.gradle")
  from("$rootDir/gradle/jar.gradle")
}

// CVE-2026-68497 (jackson-databind, unbounded numeric parsing), then CVE-2026-89407, -89425,
// -91776 and -91777 (fixed in 3.1.7 / 2.21.7): Spring Boot 4.1.1 manages 3.1.5 and 2.21.5, and
// the image scan refuses those. Remove once a Boot release manages these versions or later.
ext['jackson-bom.version'] = '3.1.7'
ext['jackson-2-bom.version'] = '2.21.7'

// We MUST keep all dependencies in the build.gradle to allow dependabot to provide version updates
// Sadly, dependabot does not track dependencies in the apply-from files
dependencies {
  // Java core
  implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

  compileOnly 'org.projectlombok:lombok:1.18.48'
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

  // Spring boot core
  implementation 'org.springframework.boot:spring-boot-starter-web'
  testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
  testImplementation('org.springframework.boot:spring-boot-starter-test') {
    exclude group: 'junit', module: 'junit'
    exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
  }


  // --- The operations API's two estate starters (increment 005) ---
  // Authorisation: drools rules over the caller's usersgroups membership, identity from the
  // CJSCPPUID header. Audit: every request and response published to the estate's audit context.
  // Declared in gradle/libs.versions.toml rather than inline - the one exception to the rule above,
  // because dependabot DOES read a version catalogue (what it does not read is the `apply from:`
  // files), and because the reference implementation pins the same pair the same way.
  implementation libs.cp.auth.rules.filter
  implementation libs.cp.audit.filter.springboot

  // --- Persistence: processed-log store (JdbcClient + Flyway) ---
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
  implementation 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'org.postgresql:postgresql'

  // --- Messaging: Azure Service Bus consumer with explicit settlement ---
  // Spring Boot's BOM does not manage com.azure:*, so the vendor BOM supplies those versions and no
  // com.azure artefact is ever pinned individually.
  implementation platform('com.azure:azure-sdk-bom:1.3.8')
  implementation 'com.azure:azure-messaging-servicebus'
  implementation 'com.azure:azure-identity'

  // --- Messaging: consume systemdocgenerator public events from the Artemis 'public.event' topic ---
  // Spring Boot 4 brings jakarta.jms + artemis-jakarta-client transitively; version via the BOM.
  implementation 'org.springframework.boot:spring-boot-starter-artemis'

  // --- Feature flag: the single 'YotResultsDistributionService' cutover lever, read per job run ---
  // Version from the azure-sdk-bom platform imported above, so no com.azure artefact is pinned here.
  implementation 'com.azure:azure-data-appconfiguration'

  // --- Scheduling: one nightly generation run even if the deployment is ever scaled beyond one pod ---
  // The lock table lives in this service's own Postgres, so the jdbc-template provider. Not managed
  // by any BOM on this build, so the version is declared here for dependabot to track.
  implementation 'net.javacrumbs.shedlock:shedlock-spring:7.10.1'
  implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.10.1'

  // --- Payload source: Redis cache (Lettuce) + results-query-api fallback ---
  // Lettuce directly rather than spring-boot-starter-data-redis: this service reads one string key
  // and needs no template, repository or converter, and the starter's auto-configuration would add
  // a health contributor and a connection factory nothing else here uses. Version from the Boot BOM.
  implementation 'io.lettuce:lettuce-core'

  // --- Observability / Actuator / OTEL / Prometheus ---
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  // --- Test: Testcontainers harness (Postgres + Service Bus emulator) ---
  // Versions come from testcontainers-bom, imported by the Spring Boot BOM. Testcontainers 2.x
  // renamed every module to a `testcontainers-` prefix, so these are the 2.x coordinates for the
  // modules the plan names (postgresql, junit-jupiter, azure).
  testImplementation 'org.testcontainers:testcontainers-postgresql'
  testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
  testImplementation 'org.testcontainers:testcontainers-azure'
  // Deterministic transport fault injection for the broker-outage suites. The plan's test matrix
  // names Toxiproxy as the recorded fallback for exactly this: stopping or freezing a container
  // makes an outage whose *timing* the suite cannot control, and both mistakes it produces are
  // silent. Version from testcontainers-bom.
  testImplementation 'org.testcontainers:testcontainers-toxiproxy'
  // The Service Bus emulator's SQL Server companion is an MSSQLServerContainer, and its readiness
  // check opens a JDBC connection — without the driver the companion never reports started. Version
  // from the Spring Boot BOM.
  testRuntimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

  // Embedded Artemis broker for the durable-subscription listener IT (version via the BOM, so the
  // embedded server always matches the BOM-managed client - no Artemis version drift). Declared on
  // the relocated `org.apache.artemis` group, which is where the BOM resolves it (2.53.0); the old
  // `org.apache.activemq` coordinate only got there through a relocation POM.
  testImplementation 'org.apache.artemis:artemis-jakarta-server'

  // HTTP stub for the results-query-api fallback suite and for the outbound
  // `add-court-register` adapter's suites. The standalone, shaded artefact deliberately: the
  // plain one drags its own Jetty and Jackson 2 onto the test classpath beside the Jackson 3 stack
  // this service runs on, and the resulting version fight is the kind that surfaces as a mystery at
  // runtime rather than as a failed resolution. Not managed by any BOM on this build, so the
  // version is declared here for dependabot to track.
  testImplementation 'org.wiremock:wiremock-standalone:3.13.2'

  // Draft-07 validator. RUNTIME dependency in this service, unlike the informant reference: the
  // C29 fix validates every outbound document against the vendored progression schemas
  // (classpath:contracts/progression/) BEFORE the POST, so a schema-invalid document is an explicit
  // FAILED with a reason rather than a swallowed 400. The dual-validation contract corpus
  // (research §9) uses the same dependency from the test classpath. Not managed by any BOM on this
  // build, so the version is declared here for dependabot to track.
  implementation 'com.networknt:json-schema-validator:3.0.8'

  // Security: pin transitive tomcat-embed-core to patched version (CVE-2026-41293, -43512, et al.)
  // Brought in transitively via spring-boot-starter-web; >=11.0.0-M1,<11.0.22 are vulnerable
  implementation 'org.apache.tomcat.embed:tomcat-embed-core:11.0.26'

  // --- Gatling performance tests: JMS bridge to Azure Service Bus ---
  // Gatling has its own compile classpath, which neither the Spring Boot BOM nor the jackson-bom
  // override above reaches, so every version is explicit here for dependabot to track. Lettuce and
  // Jackson match what the service itself resolves.
  gatlingImplementation 'io.lettuce:lettuce-core:7.5.2.RELEASE'
  gatlingImplementation 'tools.jackson.core:jackson-databind:3.1.7'
  // Qpid JMS: AMQP 1.0 transport for the SAS/emulator path.
  gatlingImplementation 'org.apache.qpid:qpid-jms-client:2.10.0'
  // Azure Service Bus JMS (Jakarta): CBS token auth for Entra-only namespaces.
  // The 2.x line uses jakarta.jms (matching Gatling 3.15 and Qpid JMS 2.x).
  gatlingImplementation 'com.azure:azure-servicebus-jms:2.1.0'
}

gatling {
  def args = [
    "-Dgatling.queueName=${System.getProperty('gatling.queueName', 'yotresultsdistribution.requests')}",
    // docker-compose.yml maps WireMock to 8089 on the host; the pipeline passes its own URL
    "-Dgatling.wiremockUrl=${System.getProperty('gatling.wiremockUrl', 'http://localhost:8089')}",
    "-Dgatling.actuatorUrl=${System.getProperty('gatling.actuatorUrl', 'http://localhost:8082')}",
    // Publish manifest read by src/gatling/scripts/verify-outputs.sh; absolute so it does not
    // depend on the Gatling JVM's working directory
    "-Dgatling.manifestPath=${System.getProperty('gatling.manifestPath', "${layout.buildDirectory.get().asFile}/nft/published-manifest.csv")}",
    "-Dlogback.configurationFile=${projectDir}/src/gatling/resources/logback-gatling.xml",
    "--add-opens", "java.base/java.lang=ALL-UNNAMED",
    "--add-opens", "java.base/java.util=ALL-UNNAMED"
  ]
  // Emulator/SAS path: an explicit connection string wins; otherwise one is composed from the
  // emulator key (-Dgatling.emulatorKey or ASB_EMULATOR_KEY). No key is ever committed here.
  def connectionString = System.getProperty('gatling.connectionString')
  def emulatorKey = System.getProperty('gatling.emulatorKey', System.getenv('ASB_EMULATOR_KEY'))
  if (connectionString == null && emulatorKey != null) {
    connectionString = "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=${emulatorKey};UseDevelopmentEmulator=true;"
  }
  if (connectionString != null) {
    args.add("-Dgatling.connectionString=${connectionString}")
  }
  // A namespace explicitly selects Entra auth in the factory and takes precedence over any
  // connection string.
  if (System.getProperty('gatling.asbNamespace') != null) {
    args.add("-Dgatling.asbNamespace=${System.getProperty('gatling.asbNamespace')}")
  }
  if (System.getProperty('gatling.redisUri') != null) {
    args.add("-Dgatling.redisUri=${System.getProperty('gatling.redisUri')}")
  }
  ['gatling.redisHitPercent', 'gatling.redisTtlSeconds', 'gatling.wiremockViaScript'].each { key ->
    if (System.getProperty(key) != null) {
      args.add("-D${key}=${System.getProperty(key)}")
    }
  }
  jvmArgs = args
}

// gatlingRun forks with the JVM running Gradle, not the Java 25 toolchain the simulations are
// compiled with, so an older JAVA_HOME fails at class loading with UnsupportedClassVersionError.
// Say so before the fork instead.
tasks.named('gatlingRun') {
  doFirst {
    if (!JavaVersion.current().isCompatibleWith(JavaVersion.toVersion(25))) {
      throw new GradleException("gatlingRun needs Gradle itself on Java 25+ (running on "
          + "${JavaVersion.current()}): point JAVA_HOME at a JDK 25 and re-run")
    }
  }
}

// The simulations are load-generation scripts, not service code: the service's PMD and Checkstyle
// rule sets (and the JaCoCo gate, which reads only the main source set) do not apply to them.
// Keep these tasks disabled rather than removed: `check` depends on them, and Gradle still runs a
// disabled task's dependencies, which is what makes `./gradlew build` compile src/gatling.
tasks.matching { it.name == 'pmdGatling' }.configureEach {
  enabled = false
}
tasks.matching { it.name == 'checkstyleGatling' }.configureEach {
  enabled = false
}

// Guard against any legacy javax.jms slipping onto the classpath alongside Spring Boot 4's jakarta.jms.
// artemis-jms-client is the javax.jms client, and Artemis 3 relocated it from the `org.apache.activemq`
// group to `org.apache.artemis`, so both coordinates are excluded: dropping the old one alone would let
// the relocated artefact back in the moment a transitive dependency moved to the new group.
configurations.all {
  exclude group: 'javax.jms', module: 'javax.jms-api'
  exclude group: 'org.apache.activemq', module: 'artemis-jms-client'
  exclude group: 'org.apache.artemis', module: 'artemis-jms-client'
}

// e2e/CliDispatchIT builds the image from this repo's own Dockerfile, which COPYs build/libs/*.jar,
// so the packaged application has to exist before the suite runs. `./gradlew build` assembles it
// anyway, but `./gradlew test` on its own does not, and the alternative - a suite skipping on an
// Assumption naming the missing jar - would be an acceptance test recording nothing on the path
// no other suite in this build can see: the entrypoint's dispatch of the operations commands out of
// the fat jar (FR-016). bootJar reads the same compiled classes the tests do, so this adds an
// ordering rather than any work.
tasks.named('test') {
  dependsOn tasks.named('bootJar')
}
