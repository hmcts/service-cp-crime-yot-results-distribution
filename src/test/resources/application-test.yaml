# The `test` profile — plain context-load tests only.
#
# It exists so tests that have nothing to do with messaging or persistence (TestProfileContextTest,
# later ActuatorIntegrationTest, and any future context-load test) keep running with no broker and
# no database, and therefore without Docker. Container-backed suites do NOT activate it: they boot
# the real configuration against Testcontainers.
yotresultsdistribution:
  # record | progression-post. The same default `application.yaml` carries, stated rather than
  # inherited: this profile's context-load tests assert the recording pipeline is the one wired, and
  # a default that moved would move them silently.
  output: record

  consumer:
    # Master switch for starting the Service Bus processor at all. Off here, so no test in this
    # profile ever tries to reach a broker.
    enabled: false
  servicebus:
    # Startup validation insists on exactly one credential source, and it is deliberately
    # unconditional: "the consumer happens to be off" is not a reason to let an ambiguous credential
    # configuration through. This is the same emulator string `application.yaml` carries as the local
    # default, and nothing in this profile ever connects with it.
    connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
  payload:
    # There is no cache and no query side in this profile, and nothing here fetches a payload. LIVE
    # would demand a system user identity at startup — correctly, since a live source without one
    # can never fetch anything — so the stub is selected explicitly. Startup refuses the stub on the
    # deployed credential source, and this profile carries the local one above.
    mode: STUB
  referencedata:
    # For the same reason: nothing in this profile matches a subscription, so there is no reference
    # data to reach and no identity mounted to reach it with. LIVE would correctly refuse to start.
    mode: STUB
  generation:
    # Off, and off UNCONDITIONALLY: `application.yaml` reads YOTRESULTSDISTRIBUTION_GENERATION_ENABLED and a
    # developer who exported it for a local run would otherwise turn the job, the listener and the
    # second datasource on inside every context-load test. Written as a literal here for that
    # reason, so nothing in this profile can be switched on from the environment.
    enabled: false
    # The downstream modes, for the same reason `payload` and `referencedata` above are stubbed:
    # nothing in this profile renders, notifies, stores a payload or reads the flag, so there is no
    # endpoint to reach and no identity mounted to reach it with, and LIVE would correctly refuse to
    # start. Startup refuses STUB on the deployed credential source, and this profile carries the
    # local one above.
    sdg-mode: STUB
    nn-mode: STUB
    fileservice-mode: STUB
    flag-mode: STUB
    # The zone stays Europe/London even with the job disabled: the startup zone check is
    # unconditional, exactly as the servicebus credential check is, because "the job happens to be
    # off" is not a reason to let a misconfigured schedule through.
    zone: Europe/London

  report:
    # Off, and off UNCONDITIONALLY, for the reason `generation.enabled` above is: `application.yaml`
    # reads YOTRESULTSDISTRIBUTION_REPORT_ENABLED, and a developer who exported it for a local run would
    # otherwise turn the 07:00 job on inside every context-load test. The e-mail output is pinned
    # off beside it because its two settings become REQUIRED at startup the moment it is true, and
    # this profile deliberately mounts neither a template nor a recipient.
    enabled: false
    email:
      enabled: false

  # Deliberately absent from this profile: yotresultsdistribution.feature.*, yotresultsdistribution.fileservice.*,
  # yotresultsdistribution.endpoints.* and yotresultsdistribution.email.templates.*. They are required only when
  # generation is enabled, and it is disabled above; leaving them unset is what proves the refusals
  # are conditional rather than making them pass with placeholder values. The one `spring.artemis`
  # key this profile does set is the embedded switch below, and it is there to keep the promise the
  # header makes rather than to configure a connection.

# The two estate filters, off in this profile. `application.yaml` defaults BOTH ON (constitution
# 5.0.0, conditions (a) and (b) of Principle III), and these two lines replace those defaults for
# context-load tests - which is the only thing a yaml file can do about them, since an exported
# AUTHZ_HTTP_ENABLED or HTTP_AUDIT_ENABLED reaches Spring as a system-environment property source
# that out-ranks every config-data file including this one.
#
# Off because this profile has neither of the estates the filters talk to: no usersgroups to resolve
# a caller's groups through, and no Artemis audit broker to publish to. Nothing here is refused for
# it - a pod with both switches off starts, deliberately - so what this buys is a context that is
# not building a Drools engine and an identity client for suites that never make a request.
authz:
  http:
    enabled: false

audit:
  http:
    enabled: false

# The audit starter's own switch, off in this profile - the same reasoning
# `yotresultsdistribution.generation.enabled` above is written as a literal for. `application.yaml` reads
# CP_AUDIT_ENABLED, and without this line every context-load test in this profile would inherit
# whatever that placeholder resolved to and build an Artemis connection factory for an audit broker
# that is not there: the library's auto-configuration validates `cp.audit.hosts` and `cp.audit.port`
# while constructing it, and does so whether or not HTTP auditing is on.
#
# What this line does is replace that placeholder's default, and no more. An exported
# CP_AUDIT_ENABLED reaches Spring as a system-environment property source, which out-ranks every
# config-data file including this one, so a developer who exported it as `true` would still switch
# the transport on under this profile. This profile promises no broker; keeping that promise
# against an exported variable is not something a yaml file can do, and the comment used to say it
# was.
cp:
  audit:
    enabled: false

spring:
  artemis:
    # `artemis-jakarta-server` is on the test classpath for the durable-subscription listener IT, and
    # with the embedded broker classes visible Boot's ArtemisAutoConfiguration DEDUCES embedded mode
    # whenever `spring.artemis.mode` is unset - so a full in-VM broker would start and stop inside
    # every context load in this profile, contradicting the "no broker" promise in the header. Off
    # unconditionally: the deduction runs off the classpath, not off any switch above, so disabling
    # the consumer and the generation job does not suppress it. The deployed profiles never set this
    # (the server artefact is test-only there), so nothing outside the tests is affected.
    embedded:
      enabled: false
  autoconfigure:
    # No datasource is configured in this profile, and with the JDBC starter on the classpath
    # DataSourceAutoConfiguration would otherwise fail the context demanding a URL. Flyway's
    # auto-configuration is conditional on a DataSource and would back off on its own; it is
    # excluded explicitly so the reason is stated rather than inferred.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

management:
  otlp:
    metrics:
      export:
        # No collector is listening during a test, and the exporter's shutdown attempt writes a
        # connection warning into every suite's output. Turning it off here keeps the test log
        # readable; the deployed configuration is untouched.
        enabled: false
  endpoint:
    health:
      group:
        # The deployed readiness group is `db,intakeStartup` (the store and this pod's own gated
        # start gate readiness, the broker never does). Spring validates group membership at
        # startup, so naming an absent `db` contributor here — absent precisely because the
        # datasource auto-configuration is excluded above — would fail the context. `ping` keeps the
        # group well formed and the endpoint shape identical.
        readiness:
          include: ping
