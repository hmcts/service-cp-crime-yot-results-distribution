spring:
  application:
    name: service-cp-crime-yot-results-distribution

  # The processed-log store. Every value here is a LOCAL development default matching the `postgres`
  # service in docker-compose.yml; deployed environments override them from Key Vault through the
  # Secrets Store CSI driver, which reaches these keys by the usual relaxed-binding environment
  # variables (SPRING_DATASOURCE_URL and friends).
  datasource:
    url: jdbc:postgresql://localhost:5432/yotresultsdistribution
    username: yotresultsdistribution
    password: yotresultsdistribution
    hikari:
      # Lazy pool initialisation: no connection is opened during context refresh, so the application
      # starts even with the store down. It has to — actuator must be up to report readiness DOWN
      # honestly, and a pod that cannot start cannot tell anyone why (research §7).
      initialization-fail-timeout: -1
      data-source-properties:
        # A store that dies without closing its connections would otherwise block the health probe
        # for ever, and intake would never suspend. Seconds, per the PostgreSQL JDBC driver.
        socketTimeout: 30

  flyway:
    # The Flyway bean is configured here; when the migration runs is a separate decision. The
    # lifecycle controller takes it off the context-refresh path and runs it on the first successful
    # store probe, before intake starts, so no message is ever consumed against an unmigrated schema.
    enabled: true

  # The Artemis connection behind the `public.event` subscription (the systemdocgenerator completion
  # events). Every value is a binding, never a value chosen here: the broker URL and credentials
  # arrive from Key Vault through the Secrets Store CSI driver, and the empty defaults leave a local
  # run with nothing to connect to unless docker-compose's `artemis` is pointed at explicitly.
  # The broker NEVER gates readiness (constitution): a blip must not roll the pods.
  artemis:
    broker-url: ${ARTEMIS_BROKER_URL:}
    user: ${ARTEMIS_USER:}
    password: ${ARTEMIS_PASSWORD:}

  jms:
    # `public.event` is a TOPIC, so the listener container has to be told so; a queue-shaped
    # container would silently receive nothing from a multicast address.
    pub-sub-domain: true
    # A DURABLE subscription, so events published while every pod is down or redeploying are still
    # delivered afterwards. A batch's completion arrives exactly once and there is no second chance
    # to hear it, and since 004 there is no second informant either: a batch no event reaches
    # is released as stale by the next run rather than asked after, so the subscription is the
    # only way an outcome arrives.
    subscription-durable: true
    # There is deliberately NO `client-id`. The subscription is SHARED (set in PublicEventsConfig,
    # for which Spring binds no property), so it is keyed by its name alone and needs none - and a
    # client id every replica carried is exactly what makes the broker refuse the second pod's
    # connection. Changing a subscription between shared and non-shared abandons the existing
    # subscription and its backlog; this is done while no environment holds one.

server:
  port: ${SERVER_PORT:8082}

yotresultsdistribution:
  # record | progression-post. `record` writes the register into this service's own store and is what
  # an environment that says nothing gets. `progression-post` is the 001 behaviour - POST to the
  # progression command API - kept only as a fallback sequencing option while progression's leg is
  # still deployed. It is a BUILD-TIME fallback, not the cutover switch: the one lever that decides
  # which implementation generates is the App Configuration flag `YotResultsDistributionService`
  # (constitution Principle III), and nothing here may become a second one.
  output: record

  consumer:
    # The master switch for intake. Off in the `test` profile, so context-load tests need no broker.
    enabled: true

  intake:
    # How often IntakeAgeSweep refreshes the two intake gauges - the age of the oldest unfinished
    # request and the count of unfinished requests over the threshold. Without it the gauges hold
    # whatever they were born with for the life of the pod, and an alert on a gauge that never moves
    # is an alert that never fires.
    #
    # The interval is also how long an alert can lag the thing it is about, which is why it is
    # minutes rather than the hours a scheduled report would give: a stuck intake is visible within
    # one refresh rather than at 07:00 the next morning.
    #
    # ITS OWN KEY, on the intake record, and NOT under yotresultsdistribution.report: the sweep belongs to the
    # intake half and runs in every JVM that is not a command, whichever of the other two halves this
    # deployment switched on. A pod with both of them off binds neither of their records, so a value
    # borrowed from yotresultsdistribution.generation.batch-age-refresh would be a value it could not read.
    # Written here as well as on the record because @Scheduled(fixedDelayString = ...) resolves it
    # through the placeholder resolver, which cannot see a record's @DefaultValue.
    gauge-refresh: 10m

  servicebus:
    # LOCAL AND CI ONLY — the Service Bus emulator's well-known development string, which is why it
    # ends UseDevelopmentEmulator=true. A deployed environment sets `namespace` instead and clears
    # this; exactly one of the two may be set, and startup fails fast otherwise.
    connection-string: "Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    # namespace: set in deployed environments only, for workload identity.
    queue-name: yotresultsdistribution.requests
    # Two concurrent deliveries, matching the Durable Functions throttle this service replaces.
    max-concurrent-calls: 2
    # Mirrors the broker queue's own setting. Used to recognise the final permitted delivery, so it
    # must be changed here and on the queue together.
    max-delivery-count: 5
    # Must be at least the processing deadline plus the fixed 30s renewal margin, so the broker lock
    # always outlives a legitimate run. Validated at startup.
    max-auto-lock-renew-duration: 5m
    # An unresolved connection error older than this, with no traffic since, stops being reported as
    # an outage: an idle queue produces no traffic, and absence of traffic is not a failure.
    health-staleness: 60s

  claim:
    # How long an acquired claim stays live, written as now() + lease by the database.
    lease: 5m
    # The enforced bound on a run. Strictly shorter than the lease, so a slow runner stops itself
    # before its claim can be reclaimed. Validated at startup.
    processing-deadline: 4m

  store:
    # How often the store is probed, driving the gated start and the resume after an outage.
    probe-interval: 10s

  progression:
    # The progression context — the command API this register is POSTed to
    # (progression.add-court-register). This is the SUBMISSION namespace; the results context below
    # is only the payload-query fallback. LOCAL DEFAULT ONLY, and not a value chosen here: it is the
    # baseUri the Progression command API's own RAML declares. Deployed environments set
    # PROGRESSION_BASE_URL to the internal mesh host.
    base-url: ${PROGRESSION_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity. A secret: it arrives from Key Vault through the Secrets Store CSI
    # driver, so what is written here is the binding and never a value — the empty default leaves a
    # local run with no identity to borrow.
    # It is REQUIRED in LIVE mode. The command is refused without it, so the service refuses to
    # start without it rather than dead-letter every hearing it is given, one 403 at a time. Named
    # here rather than left to relaxed binding: a variable a comment documents and no key reads is
    # a deployment that sets it correctly and still fails to start.
    system-user-id: ${YOT_RESULTS_DISTRIBUTION_SYSTEM_USER_ID:}
    # Retry policy for the POST (defect fixes C1/C3), and the SAME three keys the payload fallback
    # and the reference-data read carry: one RetryPolicy object serves all four clients (notificationnotify included), so
    # max-attempts / initial-backoff / max-backoff mean the same thing wherever they appear.
    # Connect and read failures, 5xx, 429 AND 408 are retried with exponential back-off; any other
    # 4xx is a refusal and is never retried; a Retry-After header is honoured on EVERY retryable
    # answer, in delta-seconds only and bounded by max-backoff (an HTTP-date value is classified,
    # never parsed). Success is 202 and nothing else. The numbers are this service's own: the
    # contract documents that back-off happens, not how much of it, so they are configuration
    # rather than constants.
    max-attempts: 4
    initial-backoff: 500ms
    # The ceiling on any wait, a server-supplied Retry-After included — and therefore the WORST CASE
    # for every wait, since a remote service may ask for the ceiling on every attempt. Startup
    # budgets it that way: three waits of 5s plus four attempts of 5s + 10s is 75s of the
    # four-minute deadline.
    max-backoff: 5s
    connect-timeout: 5s
    # Bounded so the whole run fits: the payload fetch, the now-subscriptions read and this
    # submission are spent inside ONE claim, and startup refuses a set of timeouts whose sum plus a
    # fixed 30s margin for the guard's writes and the transformation reaches
    # yotresultsdistribution.claim.processing-deadline.
    read-timeout: 10s
    # headers: an optional map of extra static headers for the POST, bound but empty by default.

  submission:
    # Pre-send contract validation (defect fix C29): every outbound document is validated against
    # the vendored progression schemas (classpath:contracts/progression/) before the POST; a
    # schema-invalid document is an explicit FAILED with a reason, never a swallowed 400.
    # This key is a STARTUP RULE, not a runtime switch: startup refuses false wherever the deployed
    # credential source (servicebus.namespace) is in use, and the validator is wired unconditionally
    # in PipelineConfig, so nothing reads the value on the hot path. A wiring that honoured it would
    # put C29's blind spot back behind one property.
    validate-outbound: true

  results:
    # The results context QUERY API — the payload fallback the cache misses to
    # (hearingDetails/internal). Fallback ONLY: the register is not POSTed here (that is
    # yotresultsdistribution.progression above). LOCAL DEFAULT ONLY; deployed environments set
    # RESULTS_BASE_URL to the internal mesh host.
    base-url: ${RESULTS_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity for the fallback query, same sourcing rules as progression's. REQUIRED
    # in LIVE payload mode: an anonymous query is refused every time.
    system-user-id: ${YOT_RESULTS_DISTRIBUTION_SYSTEM_USER_ID:}

  referencedata:
    # LIVE | STUB. LIVE is the reference-data query-API adapter and is what an environment that says
    # nothing gets: a service that has to be told where its register's recipients come from is a
    # service that will one day be deployed not asking. STUB asks reference data nothing and answers
    # that nobody is subscribed, for local runs and for the container suites whose subject is
    # settlement and the processed log rather than the register's recipients; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use, AND beside a LIVE
    # payload source — real hearings answered that way would every one of them complete
    # no-subscriptions, which is this flow's commonest legitimate outcome and so indistinguishable
    # from working.
    mode: LIVE
    # LOCAL DEFAULT ONLY, and not a value chosen here: it is the baseUri the reference-data query
    # API's own RAML declares. Deployed environments set REFERENCEDATA_BASE_URL to the internal mesh
    # host. Its own key rather than a member of results.*, because it is a different deployment
    # behind a different host.
    base-url: ${REFERENCEDATA_BASE_URL:http://localhost:8080}
    # The CJSCPPUID identity, a secret from Key Vault via the Secrets Store CSI driver. It falls back
    # to this service's own identity because the function app threads a single `cjscppuid` through
    # both calls (ReferenceDataService.js:44), so an environment that mounts one identity is not
    # asked for a second; REFERENCEDATA_SYSTEM_USER_ID exists for the day reference data authorises
    # a different one. REQUIRED in LIVE mode: an anonymous query is refused every time, so the
    # service refuses to start rather than park every hearing that produced a register.
    system-user-id: ${REFERENCEDATA_SYSTEM_USER_ID:${YOT_RESULTS_DISTRIBUTION_SYSTEM_USER_ID:}}
    # headers: an optional map of further static headers for the read, bound but empty by default —
    # the same key yotresultsdistribution.progression carries and for the same reason. CJSCPPUID is
    # documented and reference data's authorisation scheme is not: its access-control rules require
    # the caller to be in a named user group, so whatever the mesh turns out to need can be supplied
    # without a code change and nothing is invented here meanwhile. A header configured under a
    # contract name (Accept, CJSCPPUID) REPLACES the contract value rather than joining it — two
    # values of either is a 406 or an ambiguous caller.
    # Attempt count carried from the function app's DEFAULT_PUBLISH_RETRY_COUNT
    # (AxiosRetryWrapper.js:10-11) — but the retry POLICY is the corrected one (defect fix C3) and
    # it is the same object every named client holds: connect/IO failures, 5xx, 429 and 408 retry
    # with exponential back-off bounded by max-backoff, a Retry-After is honoured on every retryable
    # answer, and any other 4xx never retries. The legacy wrapper's inverted policy (every status at
    # or below 429 non-retryable) and its fixed one-second interval are catalogued defects, not
    # behaviours to keep — which is why DEFAULT_PUBLISH_RETRY_INTERVAL has no key here any more.
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 2s
    connect-timeout: 5s
    # Shorter than the processing deadline on purpose, for the reason the payload read's is: a read
    # that outlives the deadline outlives the claim behind it — and shorter again so that this read,
    # the payload fetch and the submission TOGETHER fit inside one run's budget, which is what
    # startup now checks. Three attempts of 5s + 10s with two bounded waits of 2s is 49s.
    read-timeout: 10s

  stub:
    # NONE | TRANSIENT. Test and local profiles only: it is deliberately not a field in the message
    # and not an HTTP endpoint, either of which would be a production fault-injection surface.
    payload-failure-mode: NONE
    # ON | OFF | UNREADABLE, and only what the STUB feature-flag reader answers - it decides nothing
    # wherever generation.flag-mode is LIVE, which is everywhere the service is deployed. ON is the
    # default and is the opposite of the live reader's fail-closed disposition on purpose: the stub
    # has no store to fail against, and an answer of OFF would skip every local run before it began.
    # The other two exist so the skip paths can be exercised deliberately.
    flag-answer: ON

  payload:
    # LIVE | STUB. LIVE is the cache-with-query-fallback adapter and is what an environment that
    # says nothing gets: a service that has to be told to fetch payloads is a service that will one
    # day be deployed not fetching them. It requires yotresultsdistribution.results.system-user-id,
    # without which
    # its fallback cannot authorise. STUB is for local runs and for the container suites whose
    # subject is settlement and the processed log rather than the payload; startup refuses it
    # wherever the deployed credential source (servicebus.namespace) is in use.
    mode: LIVE
    redis:
      # LOCAL development defaults, matching the datasource above. Deployed environments override
      # the address and mount the key from Key Vault through the Secrets Store CSI driver.
      host: localhost
      port: 6379
      # password: deployed only, from Key Vault. Never committed.
      # TLS is off for a developer's local server and on everywhere it is deployed — with
      # certificates verified, which the function app disables (registered deviation 1).
      ssl: false
      # The prefix the producer writes the payload under. INT_ is this flow's; SJP hearings stay in
      # the NOWs function app and are out of scope.
      key-prefix: INT_
      connect-timeout: 5s
      command-timeout: 5s
    fallback:
      # Attempt count carried from the function app's defaults; the retry POLICY is the corrected C3
      # one and is the same object every named client in this file holds — connect/IO, 5xx, 429 and
      # 408 retry with exponential back-off bounded by max-backoff, a Retry-After is honoured on
      # every retryable answer, and no other 4xx ever retries.
      max-attempts: 3
      initial-backoff: 1s
      max-backoff: 2s
      connect-timeout: 5s
      # Shorter than the processing deadline on purpose: a read that outlives the deadline outlives
      # the claim behind it, and then two runners believe they own the same request. Shorter again so
      # the fetch leaves room for the now-subscriptions read and the submission spent in the same
      # run: 20s of cache reads and three attempts of 5s + 10s with two bounded waits of 2s is 69s
      # of the four-minute budget.
      read-timeout: 10s

  generation:
    # The master switch for the whole downstream half: the nightly job, the public-event listener,
    # the file-service datasource and the validators that guard them. LOCAL DEFAULT ONLY - it is
    # false here so a developer's run and the plain context-load tests need no broker, no second
    # database and no App Configuration; deployed environments set YOTRESULTSDISTRIBUTION_GENERATION_ENABLED
    # to true. Turning it on turns on the startup refusals with it: the file-service datasource, the
    # flag configuration, the SDG/NN endpoints and the e-mail template id all become required.
    enabled: ${YOTRESULTSDISTRIBUTION_GENERATION_ENABLED:false}
    # 18:00, Monday to Friday. Six fields, Spring's cron dialect (second first).
    cron: "0 0 18 * * MON-FRI"
    # The zone the cron above is read in, and the requirement is 18:00 WALL CLOCK in BST and GMT
    # alike. The legacy fires in the scheduling JVM's default zone because its Quartz trigger is
    # built without a time zone; that ambiguity is not inherited. Startup refuses any other value
    # unless zone-override-acknowledged below is true.
    zone: Europe/London
    # An explicit acknowledgement, and the only way to run in another zone. It exists so a zone
    # change is a deliberate, reviewable act rather than a typo that silently moves the run.
    zone-override-acknowledged: false
    # The bound on REQUESTING: how long one run may go on asking systemdocgenerator to render
    # batches. Completion is event-driven, so a slow render never spends this budget and never
    # blocks the next request.
    run-deadline: 60m
    # How long the ShedLock lock over the nightly run is held, and the value the job's
    # @SchedulerLock reads. It is run-deadline plus a fixed ten-minute margin, so a run still inside
    # its hour cannot be joined by the replica that took the lock it had already lost - two
    # documents and two e-mails for every court centre in the country. Lengthening run-deadline
    # without lengthening this is refused at startup rather than discovered at 18:00.
    lock-at-most-for: 70m
    # How long a batch the schedule made may be awaiting its render before the next run gives up on
    # it: the run's first act fails every PENDING or GENERATING batch at least this old under
    # NOT_COMPLETED_BY_NEXT_RUN and releases its registers, so the same run assembles them again and
    # the court centre gets its document tonight. A batch an operator asked for by hand is given the
    # longer of this and lock-at-most-for above, because a manual generation holds no run lock and
    # has the whole requesting deadline to work in. Refused at startup if it is not positive - it is
    # destructive, and a zero would fail every batch a run could see.
    stale-after: 30m
    # How often the three batch-age readings - the oldest batch awaiting a render, the oldest that
    # never reached the renderer, and the oldest holding an unnotified document - are refreshed
    # between runs. Written here as well as on the record for the reason
    # yotresultsdistribution.intake.gauge-refresh is: @Scheduled(fixedDelayString = ...) resolves it through
    # the placeholder resolver, which cannot see a record's @DefaultValue. Refused at startup if it
    # is not positive, because a Micrometer gauge never decays and a reading nobody takes again is
    # three gauges holding whatever they last said.
    batch-age-refresh: 10m
    # LIVE | STUB, one per downstream, with the same rule the 001 modes carry: LIVE is what an
    # environment that says nothing gets, and startup refuses STUB wherever the deployed credential
    # source (servicebus.namespace) is in use or generation is enabled. The stubs exist for local
    # runs and for the container suites whose subject is the batch state machine rather than the
    # downstream itself.
    sdg-mode: LIVE
    nn-mode: LIVE
    fileservice-mode: LIVE
    flag-mode: LIVE

  notification:
    # How long the notifying leg's claim on a batch stays live, measured from its LAST RENEWAL. One
    # notifier tells one batch's recipients at a time - the outcome sink on a delivered
    # document-available and an operator's resend both derive the same owed set from the same
    # records - and this is how long a notifier that has stopped renewing is given before something
    # else may take the batch over.
    #
    # Its own setting rather than the stale-after above, which answers a different question: how
    # long a batch may be awaiting its render before a run gives up on it is no bound at all on
    # telling a generated batch's recipients, whose cost is the number of Youth Offending Teams the
    # batch is addressed to times whatever notificationnotify makes of each of them.
    #
    # The claim is renewed before EVERY POST - the retries of one recipient included - before each
    # row's settlement and before the batch's own, so what this has to cover is ONE RECIPIENT'S
    # RETRY CYCLE and not a whole batch of them. Startup refuses any value below
    #
    #     2 x (yotresultsdistribution.endpoints.max-attempts
    #             x (yotresultsdistribution.endpoints.connect-timeout
    #                   + yotresultsdistribution.endpoints.read-timeout)
    #          + (yotresultsdistribution.endpoints.max-attempts - 1)
    #             x yotresultsdistribution.endpoints.max-backoff)
    #
    # - the longest a single POST cycle can take, doubled as margin (PropertiesValidator
    # .NOTIFICATION_LEASE_MARGIN). The connect timeout is charged because an attempt that hangs on
    # the connect and then on the read is the longest single thing this leg does, and the waits are
    # the gaps BETWEEN attempts, of which there is one fewer than there are attempts. At the shipped
    # transport that is 2 x (3 x (5s + 10s) + 2 x 2s) = 98s, so fifteen minutes is generous;
    # lengthening either timeout or max-attempts without lengthening this is refused at startup
    # rather than discovered as a Youth Offending Team sent one register twice.
    claim-lease: 15m

  feature:
    # The App Configuration connection string this service reads the cutover flag with - the THIRD
    # reader of one flag, after the producer and the legacy. The job reads it once per run, with no
    # cache, and fails closed: OFF or unreadable means the run is skipped and counted, never that
    # this service generates anyway. It names the store (Endpoint=) and authorises the read (Id=,
    # Secret=). A SECRET, and never a value here: a deployed pod is given the estate's one - the
    # value the WildFly contexts read, from Vault, set in the deployment's values - because no App
    # Configuration role can be assigned to this service's identity (constitution 5.2.0). The empty
    # default leaves a local run with no store to read. Startup REFUSES the compose loop's published
    # local pair wherever its endpoint names a real .azconfig.io store or a Service Bus namespace
    # says the pod is deployed, and never quotes the value in a refusal.
    connection-string: ${YOTRESULTSDISTRIBUTION_FEATURE_CONNECTION_STRING:}
    # The setting key, in App Configuration's feature-flag form. It is the SAME key the legacy JS
    # client reads, which is what makes the flag one lever rather than three: changing it here
    # without changing it there would leave two implementations disagreeing about the cutover.
    key: .appconfig.featureflag/YotResultsDistributionService
    # The App Configuration label, which is how one store serves every stack. Empty locally; the
    # deployment supplies its stack's label. A wrong label reads a different stack's flag.
    label: ${STACK_LABEL:}
    # The whole budget for the read, and short on purpose: the flag gates the start of a run, and a
    # store that is slow must not hold the run open. A timeout is UNREADABLE, which is OFF.
    timeout: 2s

  fileservice:
    # The framework file service's own Postgres - one shared database per stack - written to
    # directly, because systemdocgenerator's generate-document takes a payloadFileServiceId and will
    # only render a payload that is already in the file service. This service's use of it is
    # WRITE-ONLY: it inserts the metadata and content rows the framework's own repositories insert
    # and reads nothing back. A separate datasource from spring.datasource above, and one that gates
    # readiness only while a run is in progress. Bindings, never values: the URL and credentials
    # arrive from Key Vault through the Secrets Store CSI driver, and the empty defaults are what
    # make startup refuse when generation is enabled without them.
    url: ${FILESERVICE_DATASOURCE_URL:}
    username: ${FILESERVICE_DATASOURCE_USERNAME:}
    password: ${FILESERVICE_DATASOURCE_PASSWORD:}

  endpoints:
    # The internal mesh hosts of the two downstreams. HOSTS ONLY: each client appends its own
    # contract path (systemdocgenerator's one command, generate-document; notificationnotify's
    # send-email-notification), so a path written here would be appended to.
    # Empty by default rather than pointed at localhost: an endpoint this service invents is an
    # endpoint a deployment can forget to set and still start. With generation enabled, startup
    # refuses without them.
    systemdocgenerator: ${SYSTEMDOCGENERATOR_BASE_URL:}
    notificationnotify: ${NOTIFICATIONNOTIFY_BASE_URL:}
    # The CJSCPPUID both downstream calls are made under. One identity, because the nightly run is
    # one caller: it asks systemdocgenerator to render a batch and notificationnotify to e-mail it,
    # inside one run, and the morning report's own send is made under it too. The same service
    # identity the results and reference-data reads already use; empty locally, because a run that
    # has no endpoints to call needs nobody to call them as. REQUIRED at startup wherever either
    # outward half sends - generation enabled, or the report's e-mail output on - because
    # notificationnotify refuses a command carrying no CJSCPPUID, and a pod that set the endpoint
    # and forgot this one starts clean and fails every send.
    system-user-id: ${YOT_RESULTS_DISTRIBUTION_SYSTEM_USER_ID:}
    # The transport the two clients share, at the estate's own defaults. Both timeouts are set
    # deliberately: a render request with no read timeout can outlive the run deadline that was
    # supposed to bound it, and a night that never returns from one POST is a night that generates
    # nothing behind it.
    max-attempts: 3
    initial-backoff: 1s
    max-backoff: 2s
    connect-timeout: 5s
    read-timeout: 10s

  email:
    templates:
      # The notificationnotify template the court-register e-mail is sent with, by UUID. It is
      # REQUIRED in LIVE mode when generation is enabled and validated for shape at startup, not at
      # send time (defect fix P9): a blank or malformed id discovered at 18:00 is a night's registers
      # unsent, whereas a deployment that cannot start is a deployment that gets fixed. A binding,
      # never a value - the id belongs to the environment's notificationnotify configuration.
      cr_standard: ${CR_EMAIL_TEMPLATE_ID:}

  publicevents:
    # The platform's shared public-event topic, and the destination the completion listener
    # subscribes to. Not this service's own topic and not configurable per environment in practice:
    # it is the estate's one multicast address.
    topic: public.event
    # The shared durable subscription's name on the broker, and - with no client id - the whole of
    # its identity: every replica attaches to this one name and the broker load-balances the
    # outcomes across them. Changing it abandons the existing subscription and its backlog.
    subscription: yotresultsdistribution-service.sdg
    # The JMS selector, applied by the BROKER, so only the two systemdocgenerator outcome events
    # ever reach this service off a topic the whole estate publishes to. It is the coarse filter
    # only: the listener still keeps just the events whose originatingSource is YotResultsDistributionService
    # and correlates them to a batch by sourceCorrelationId, which is what keeps progression's
    # still-deployed listener and this one out of each other's documents. Changing it, like
    # changing the name, abandons the existing shared subscription and its backlog: under JMS 2.0 a
    # shared subscription with a different selector is a different subscription.
    selector: "CPPNAME IN ('public.systemdocgenerator.events.document-available','public.systemdocgenerator.events.generation-failed')"

  report:
    # The master switch for the morning exception report: the 07:00 job and its own scheduler. LOCAL
    # DEFAULT ONLY - false here so a developer's run and the plain context-load tests write nobody a
    # report; deployed environments set YOTRESULTSDISTRIBUTION_REPORT_ENABLED to true.
    #
    # NOT A CUTOVER LEVER. The report reads and writes nothing the cutover decides and never reads
    # the YotResultsDistributionService flag; it runs on a pod whose generation half is switched off, which is
    # what makes it its own switch rather than a second reading of somebody else's.
    enabled: ${YOTRESULTSDISTRIBUTION_REPORT_ENABLED:false}
    # 07:00, Monday to Friday. Six fields, Spring's cron dialect (second first). It is also the
    # window: the run reads back to the PREVIOUS occurrence of this cron, so a Monday run reads back
    # to Friday and every FAILED request, batch and notification lands in exactly one report. Change
    # it and the window follows; there is deliberately no separate window setting to disagree with
    # it.
    cron: "0 0 7 * * MON-FRI"
    # The zone the cron above is read in, and the requirement is 07:00 WALL CLOCK in BST and GMT
    # alike - support reads this before the day's hearings either way. The same rule the nightly
    # run's zone carries, stated once in GenerationProperties.requireTheCourtsZone: startup refuses
    # any other value unless zone-override-acknowledged below is true.
    zone: Europe/London
    # An explicit acknowledgement, and the only way to run in another zone. It exists so a zone
    # change is a deliberate, reviewable act rather than a typo that silently moves the run.
    zone-override-acknowledged: false
    # How long the ShedLock lock over the morning run is held, and the value the job's
    # @SchedulerLock reads as a placeholder - which is why this key is written here as well as on
    # the record: the annotation's attribute is resolved by the placeholder resolver and cannot see
    # a @DefaultValue. It is the fixed five-minute run budget
    # (PropertiesValidator.REPORT_RUN_BUDGET) plus the ten-minute SCHEDULER_LOCK_MARGIN the nightly
    # run's 70m already uses. Anything lower is refused at startup rather than discovered as support
    # being sent the same morning twice by two replicas.
    lock-at-most-for: 15m
    # The intake threshold. A request still RECEIVED or RETRYING for longer than this is reported
    # late and counted on yotresultsdistribution_non_terminal_requests_over_threshold. Per environment and
    # changeable without a release: a stack whose broker is slower wants a wider one, and the next
    # run reads whatever it says.
    request-terminal-within: 30m
    # The notification limit. A batch GENERATED but not NOTIFIED for longer than this is reported
    # late. Without it a document that was rendered and never e-mailed looks exactly like one that
    # was e-mailed, which is the failure this report exists to surface.
    notified-within: 15m
    # The rendering limit. A batch still PENDING or GENERATING for longer than this is reported late.
    # Its own value since 004: it used to resolve from the generation half's grace-period, and that
    # setting is now stale-after and answers a different question - when a run gives up on a batch
    # and re-batches its registers, rather than when support should be told a render is late.
    # Following it would have moved this threshold from ten minutes to thirty as a side effect.
    # Refused at startup if it is not positive, under this key.
    batch-generated-within: 10m
    #
    # There is also NO window key. The window is the cron above.
    #
    # How many REQUEST_LATE and BATCH_LATE entries one report may carry. A morning can be arbitrarily
    # bad and the log sink writes one event per exception, so without a ceiling a single outage is a
    # write that outlives the run's own lock and the events anybody needed are behind the fifty
    # thousand nobody read. Over the cap the OLDEST are kept - they have been wrong longest - and the
    # rest are counted as truncated on the summary event and on both run lines.
    #
    # It bounds the recurring late kinds; a failure is never dropped, because a failure a window
    # dropped is a failure no window would ever report again. The two late kinds are read against a
    # cut-off, so whatever this run leaves out the next run reads again, older; REQUEST_FAILED,
    # BATCH_FAILED and NOTIFICATION_FAILED are read over a half-open window aligned to the schedule,
    # and no later run reads that window a second time.
    #
    # The five counts are NOT capped either: they are what the reads found, because a count that
    # shrank with the list would make the worst morning of the year read as a quieter one. A zero is
    # refused at startup: a report that carries no late entry is indistinguishable from a morning
    # with nothing wrong on it.
    max-entries: ${YOTRESULTSDISTRIBUTION_REPORT_MAX_ENTRIES:5000}
    email:
      # The e-mail output, switchable independently of the Log Analytics output: a stack whose
      # notificationnotify template has not been provided yet still writes the events, and support
      # reads the report either way. False until that template exists - and the moment it is true,
      # the two settings below become required at startup.
      enabled: ${YOTRESULTSDISTRIBUTION_REPORT_EMAIL_ENABLED:false}
      # The notificationnotify template the report is sent under, by UUID. REQUIRED and validated
      # for shape at startup once the output above is enabled, not at send time - the same argument
      # fix P9 makes for the register's own template, one morning earlier. A binding, never a value:
      # the id belongs to the environment's notificationnotify configuration.
      template-id: ${CR_REPORT_TEMPLATE_ID:}
      # Who the report goes to, comma-separated. NEVER a value in this repository and never a chart
      # value: they are people's addresses, and they arrive from Key Vault through the Secrets Store
      # CSI driver. Required and non-empty once the output above is enabled, and every entry has to
      # parse as an address - a list with a stray separator in it is refused every recipient of every
      # morning by notificationnotify otherwise, and the refusal names the setting without quoting
      # the address back.
      recipients: ${YOTRESULTSDISTRIBUTION_REPORT_RECIPIENTS:}

  # The operations API's own settings. The defaults are `config/OperationsProperties`'s and are
  # restated here for the reason every other block of this service's settings is: a deployment can
  # see what it is getting and override it without reading Java.
  operations:
    # DEPLOYMENT SHAPE, NOT A CUTOVER LEVER (FR-044). It decides whether the seven `/operations/**`
    # endpoints are served, and nothing else. The one lever that decides which implementation is
    # live is the App Configuration flag `YotResultsDistributionService`, and this must never become a
    # second one - a pod with the endpoints off still records, batches, renders and notifies exactly
    # as it did.
    enabled: ${YOTRESULTSDISTRIBUTION_OPERATIONS_ENABLED:true}

    # How far back `POST /operations/registers/supersede` may reach. The command it replaces was
    # unbounded, because it was reachable only by somebody already inside the namespace with a
    # runbook open; an endpoint reaches further, and an unbounded irreversible mutation is one
    # keystroke from giving up the estate's whole history of registers. Refused at startup if it is
    # not positive: a bound of zero admits no instant at all and reads to an operator as though
    # their own argument were wrong.
    supersede-max-age: ${YOTRESULTSDISTRIBUTION_SUPERSEDE_MAX_AGE:30d}

    # How long a background regeneration waits for the register-generation lock before recording
    # SCHEDULE_RUNNING as its own outcome. ZERO IS THE DEFAULT AND IS ONE NON-BLOCKING ATTEMPT,
    # which is the only kind that cannot sit on a thread the schedule wants. Refused at startup if
    # it is negative.
    lock-wait: ${YOTRESULTSDISTRIBUTION_OPERATIONS_LOCK_WAIT:0s}

# Application Insights is configured by the Java agent (lib/applicationinsights.json).
# The per-environment connection string is supplied as APPLICATIONINSIGHTS_CONNECTION_STRING,
# mounted from Key Vault via the Secrets Store CSI driver; there is nothing to set here.

# The two estate filters that make the operations API permitted at all: `cp-auth-rules-filter`
# resolves the caller's usersgroups membership against the allow rules, and
# `cp-audit-filter-springboot` publishes a request and a response event for every call.
#
# BOTH DEFAULT ON, and that is how conditions (a) and (b) of constitution Principle III are carried
# (5.0.1, 2026-09-20). Each library's own auto-configuration is
# `@ConditionalOnProperty(havingValue = "true")` with no `matchIfMissing`, so a deployment that said
# nothing would get no authorisation filter and no audit publisher; these two lines reverse that, so
# a deployment that says nothing is authorised.
#
# AUDITED TAKES ONE MORE KEY, AND IT IS NOT THIS FILE'S. `audit.http.enabled` builds no filter on
# its own: every `audit.http.*` bean the starter declares sits inside the `@AutoConfiguration` class
# `cp.audit.enabled` gates, and that one is `false` below so a laptop with no audit broker starts.
# Condition (b) is completed by the deployed values file setting `CP_AUDIT_ENABLED=true` with the
# broker's connection from Key Vault (spec FR-045, deployment gate 5). A pod with this switch on
# over a transport that is off serves the operations API UNAUDITED; nothing refuses it - the
# switches are configuration - so `PropertiesValidator` says it at WARN once, at start-up, because
# the filter that would have published was never constructed and the one that is swallows every
# publishing failure.
#
# They are ordinary configuration, not a start-up condition. An operator may turn either off -
# `AUTHZ_HTTP_ENABLED=false`, `HTTP_AUDIT_ENABLED=false` - and the pod comes up: there is no
# cross-field refusal against `yotresultsdistribution.operations.enabled` and no rule that reads the
# environment to decide where one would apply. What keeps them on in a deployed environment is this
# default and the values file, not a pod that refuses to start. The two places that turn them off
# deliberately are `docker-compose.yml` (a laptop has no usersgroups and no audit broker) and
# `application-test.yaml`, and each says so where it does it.
#
# The library reads the value as the LITERAL string `true`: `yes`, `on` and `1` leave the filter
# switched off while reading as on to anything that converts. Write `true`.
authz:
  http:
    enabled: ${AUTHZ_HTTP_ENABLED:true}

    # Where the caller's groups come from. The caller is named by the CJSCPPUID header and NEVER in
    # the path, so this template is a plain URL; usersgroups answers the logged-in user's
    # permissions for whoever that header asserts (research R4, and the trust boundary FR-035 puts
    # on it - the header is a gateway assertion, and deployment gates 2 and 3 are what make it one).
    identity-url-template: ${CP_BASE_URL:http://localhost:8080}/usersgroups-query-api/query/api/rest/usersgroups/users/logged-in-user/permissions
    user-id-header: "CJSCPPUID"

    # The header `OperationsActionFilter` writes and this filter reads. It is never the caller's
    # value: the request is wrapped before this filter runs, so what arrives here is the action this
    # service derived from the path and the method.
    action-header: "CPP-ACTION"
    accept-header: "application/vnd.usersgroups.get-logged-in-user-permissions+json"

    # The rules, globbed off the classpath. `acl/operations-rules.drl` is the only file that matches
    # and the only one there may be: seven allow rules and no deny rule.
    drools-classpath-pattern: "classpath:/acl/**/*.drl"

    # The library default is TRUE - it recompiles the rules on every request. Off by default here;
    # a developer editing rules against a running service sets AUTHZ_RELOAD_RULES=true.
    reload-on-each-request: ${AUTHZ_RELOAD_RULES:false}

    # False, because our own filter always supplies an action for the paths this service serves. Set
    # true, a request to any OTHER path - actuator's, or one nothing is mapped to - would be refused
    # 400 for having no action rather than answered as the framework answers it.
    action-required: false

    # DEFAULT-DENY, and it also governs "the DRL failed verification": a rules file that will not
    # compile refuses every action rather than admitting everything. This is what makes the absence
    # of a rule the denial, and therefore what makes condition (a) of Principle III readable in
    # `acl/operations-rules.drl` rather than inferred from code.
    deny-when-no-rules: true

    # SETTING THIS REPLACES THE LIBRARY'S OWN LIST WHOLESALE. `/actuator` has to be re-listed or the
    # liveness and readiness probes start answering 401 and the pod is rolled for ever; `/error` has
    # to be, because the filter refuses through `sendError`, which forwards there - a refusal whose
    # own forward is refused answers nothing at all.
    exclude-path-prefixes:
      - "/actuator"
      - "/error"

audit:
  http:
    enabled: ${HTTP_AUDIT_ENABLED:true}

    # THE NAME IS LOAD-BEARING, AND IT IS WHY THE FILE IS NOT CALLED `openapi.yaml`. The filter
    # resolves this as `classpath*:` + `**`/`*` + the value - a SUFFIX glob over every jar on the
    # classpath, not a path - and hands the parser whichever resource the glob returns FIRST. A
    # value of `openapi.yaml` would match this service's document and any other `*openapi.yaml` a
    # dependency ships, and the audit events of a whole surface would be resolved against somebody
    # else's paths. `api/OpenApiContractTest` runs the real glob against the real classpath and
    # asserts exactly one match; `PropertiesValidator` refuses an unset value where both audit
    # switches are on, which is where the parser is actually built.
    openapi-rest-spec: ${HTTP_AUDIT_OPENAPI_SPEC:yot-results-distribution-openapi.yaml}

    # EXPLICIT, BECAUSE THE LIBRARY DEFAULT IS TRUE. Left alone, every response this surface writes
    # goes onto the audit topic: the batch listing's masked addresses and court centre ids, the
    # exception report's whole entry table, and every ProblemDetail. The audit topic is a telemetry
    # surface like any other and Principle VII governs it. What an audit event actually needs - the
    # action, the outcome, whether the flag was overridden, the superseded count - the generic
    # filter cannot infer from a body anyway, and `api/OperationsAuditService` supplies it through
    # the starter's own seam instead.
    include-payload-body: false

# The estate's audit transport, owned by `cp-audit-filter-springboot` and not by this service.
#
# It is here because of a trap rather than because this service has an opinion: the library's
# auto-configuration is gated `matchIfMissing = true`, so ADDING THE DEPENDENCY SWITCHES IT ON, and
# its connection-factory bean validates `cp.audit.hosts` and `cp.audit.port` while it is being built
# - which it does even when HTTP auditing itself is off. A local run has no audit broker, so a key
# that said nothing would be a service that would not start on a laptop.
#
# Off unless an environment says otherwise, therefore, and every environment that serves the
# operations API MUST say otherwise: this key is the second half of Principle III's condition (b),
# and a values file without `CP_AUDIT_ENABLED=true` serves the operations API unaudited. The hosts,
# port, credentials and TLS material arrive from Key Vault through the CSI driver, and none of them
# is ever a value in this file. `audit.http.*` - the HTTP half, which is what actually publishes an
# operations call - is the separate block above, and every bean it gates lives inside the
# auto-configuration class this key gates, so the HTTP half on over a transport that is off
# publishes nothing and traps nothing - which is the state the start-up WARN names.
#
# Switched ON, this key is what makes `cp.audit.hosts` and `cp.audit.port` required: startup refuses
# a transport that names no broker or a port outside 1..65535, because the audit filter swallows
# every publishing failure and a transport pointed at nothing would be silent rather than refused.
cp:
  audit:
    enabled: ${CP_AUDIT_ENABLED:false}

    jms:
      # BOUNDED, BECAUSE THE REQUEST EVENT IS PUBLISHED ON THE CALLER'S OWN THREAD. The library
      # ships ten initial attempts over a 2s interval with a 1.5 multiplier, so a broker that is
      # not there costs roughly two minutes per call - and this service publishes the request event
      # BEFORE the action, so that is two minutes of a held connection and a held servlet thread
      # before the caller is told `503 AUDIT_UNAVAILABLE`. Two attempts says the same thing in about
      # two seconds. It changes nothing about what is refused; it changes how long the refusal takes
      # (`api/OperationsAuthzIT`, which is where the two minutes were found).
      initial-connect-attempts: ${CP_AUDIT_INITIAL_CONNECT_ATTEMPTS:2}

management:
  endpoints:
    web:
      base-path: /actuator
      # The whole HTTP surface of this service. There is no business API (spec FR-014).
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true   # enables liveness / readiness groups
      group:
        readiness:
          # The store gates readiness, because processing is unsafe without it — and so does this
          # pod's own gated start, because a database that replies is not the same thing as a
          # service in a position to use it. Between them sits the deferred migration and the
          # processor, either of which can fail: a pod whose migration is throwing would otherwise
          # report ready, be sent traffic, count as a healthy replica in a rolling deployment, and
          # consume nothing while the queue grew.
          #
          # `fileServiceRun` is the third, and it is a narrower claim than the other two make. The
          # file-service datasource is in use for a few seconds a night, so the component gates
          # readiness only while a generation run is actually in progress, when an unreachable
          # payload store is a run about to fail every batch PAYLOAD_STORE_UNAVAILABLE; between runs
          # it answers UP without asking, and says that it did not ask. Naming it here is what lets
          # that decision reach readiness at all, and the component itself is what keeps the group
          # quiet for the other twenty-three hours. It is contributed whether or not generation is
          # enabled, because Spring validates group membership at startup and a name a property had
          # removed would fail the context.
          #
          # The two broker indicators, `servicebus` and `publicEvents`, are deliberately absent: a
          # blip must never roll the pods, and the service cannot heal a broker by restarting
          # (spec FR-011). Both are reported as their own components, outside every group.
          include: db,intakeStartup,fileServiceRun
  health:
    db:
      # Switched off so `db` means the register store's pool and nothing else. The
      # auto-configuration collects every DataSource on the context and, finding two on a
      # generation-enabled pod, contributes `db` as a composite over both - so the platform file
      # service being unreachable reported `db` DOWN at any hour and rolled a pod whose intake half
      # was working, and every health poll asked another team's database for a connection. That is
      # the harm FR-011 and `fileServiceRun` exist to prevent, arriving through the component next
      # to them. `StoreHealth` contributes `db` over the primary pool instead, keeping the name the
      # readiness group above and every dashboard already use; the file service is reported by
      # `fileServiceRun`, which asks about it only while a run is on.
      enabled: false
    jms:
      # Spring Boot auto-configures a `jms` health indicator as soon as a ConnectionFactory is on the
      # context, and it goes DOWN whenever the broker is quiet or briefly unreachable. That indicator
      # is part of the health aggregate, so leaving it on would let broker silence turn the whole
      # service DOWN - the exact behaviour spec FR-011 forbids, for the same reason `servicebus` is
      # kept out of the readiness group above.
      #
      # The broker is still reported, just not by this: `PublicEventsHealthIndicator` reports the
      # `public.event` subscription's own state and the age of its last delivery as its own
      # component, outside readiness, so an operator can see the broker state without a blip rolling
      # the pods - and silence on a running subscription is published as an age rather than called
      # an outage, which is exactly the judgement the auto-configured indicator would make wrongly.
      enabled: false

logging:
  # INFO, and nothing below it anywhere in this file. The privacy rules (constitution Principle VII)
  # are asserted against the code, but the level a pod runs at is what decides how much of the code
  # gets to speak: a shipped DEBUG level for one package is how a payload dump written for a local
  # diagnosis reaches the estate's log index. TelemetryPrivacyTest reads this file and fails on a
  # DEBUG or TRACE level appearing here.
  #
  # Format is not configurable and is not set here: logback.xml emits JSON unconditionally, with the
  # MDC provider that puts requestId and hearingId on every line.
  level:
    root: INFO
