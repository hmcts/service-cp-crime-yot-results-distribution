name: Build and Publish (Non-Release)

on:
  pull_request:
    branches:
      - master
      - main
      - 'team/**'
  push:
    branches:
      - master
      - main
      - 'team/**'
  # Dispatched by post-merge-catch-up.yml for a merge the push event never announced (one the
  # Actions token performed), and publishes exactly as a push would.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-draft:
    # The called workflow's jobs are capped by these; Build-Docker pushes to ghcr.io
    # with GITHUB_TOKEN so packages: write is required here.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-build-publish.yml
    secrets:
      AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
      AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
      HMCTS_ADO_PAT: ${{ secrets.HMCTS_CP_ADO_PAT }}
    with:
      environment: dev
      is_publish: ${{ github.event_name != 'pull_request' }}
      trigger_docker: ${{ github.event_name != 'pull_request' }}
      trigger_deploy: ${{ github.event_name != 'pull_request' }}
