name: Update Dependabot branches

# The main ruleset requires a branch to be up to date with main before it can merge, and
# auto-merge-dependabot.yml enables auto-merge on every Dependabot PR. Neither GitHub's auto-merge
# nor Dependabot itself brings a branch up to date when main moves, so every merge to main strands
# the Dependabot PRs still open: approved, green, and BEHIND. This closes the loop - each push to
# main (and, as a fallback, an hourly tick) asks Dependabot to rebase every open Dependabot PR that
# is behind, so its checks re-run against the new main and auto-merge can complete.
#
# Asked of Dependabot rather than done with `gh pr update-branch`, because this repository is
# public and requires approval for workflow runs from external actors: a branch updated with the
# Actions token is pushed as github-actions[bot], every check on it then waits for a maintainer to
# press "Approve and run", and the PR is exactly as stuck as before. A rebase Dependabot performs
# is pushed as dependabot[bot], whose runs the repository already accepts.

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: update-dependabot-branches
  cancel-in-progress: false

jobs:
  rebase-behind:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase every open Dependabot PR that is behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          numbers=$(gh pr list --repo "$REPO" --author 'app/dependabot' --state open \
                      --base main --json number --jq '.[].number')
          if [ -z "$numbers" ]; then
            echo "no open Dependabot PRs"
            exit 0
          fi
          for number in $numbers; do
            # Right after a push to main GitHub answers UNKNOWN while it recomputes; give it a
            # minute before deciding the PR is not behind.
            status=UNKNOWN
            for attempt in 1 2 3 4 5 6; do
              status=$(gh pr view "$number" --repo "$REPO" --json mergeStateStatus \
                         --jq .mergeStateStatus)
              [ "$status" != "UNKNOWN" ] && break
              sleep 10
            done
            if [ "$status" = "BEHIND" ]; then
              gh pr comment "$number" --repo "$REPO" --body "@dependabot rebase"
              echo "PR #$number: behind main, rebase requested"
            else
              echo "PR #$number: $status, nothing to do"
            fi
          done
